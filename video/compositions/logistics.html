  <script>
    const tl = gsap.timeline({ paused: true });
    // The pack arrives from the left (caught from the production whip) and drops into the stock table.
    tl.fromTo("#lo-bag", { x: -60, scale: 1, opacity: 1 }, { x: 900, duration: 0.45, ease: "power3.out" }, 0);   // already entering on the cut frame
    tl.to("#lo-bag", { x: 1000, y: -400, scale: .2, opacity: 0, duration: 0.3, ease: "power3.in" }, 0.45);
    tl.fromTo("#lo-stock", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.1);
    tl.fromTo("#lo-r1", { opacity: 0, scale: .96 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 0.72);
    tl.to("#lo-r1", { backgroundColor: "rgba(63,169,245,0)", duration: 0.8, ease: "power2.out" }, 1.4);
    tl.fromTo("#lo-title .w", { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 0.4);
    // The delivery: route draws, the van drives it, status flips.
    tl.fromTo("#lo-route", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 1.2);
    const path = document.querySelector("#lo-path");
    const len = path.getTotalLength();
    tl.fromTo(path, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 1.5);
    const van = document.querySelector("#lo-van");
    const drive = { p: 0 };
    const place = () => {
      const a = path.getPointAtLength(drive.p * len), b = path.getPointAtLength(Math.min(len, drive.p * len + 2));
      const angle = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      van.setAttribute("transform", `translate(${a.x} ${a.y - 20}) rotate(${angle})`);
    };
    place();
    tl.fromTo(drive, { p: 0 }, { p: 1, duration: 2.0, ease: "power1.inOut", onUpdate: place }, 2.2);
    tl.to("#lo-status", { opacity: 0, duration: 0.1 }, 4.25);
    tl.fromTo("#lo-done", { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 4.25);
    tl.to("#lo-title", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 5.1);
    // Into the coffee shop through the delivery pin.
    tl.fromTo("#lo-iris", { clipPath: "circle(0px at 1690px 810px)" },
      { clipPath: "circle(2300px at 1690px 810px)", duration: 0.6, ease: "power3.in" }, 5.35);
    window.__timelines["logistics"] = tl;
