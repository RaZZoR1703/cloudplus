  <script>
    const tl = gsap.timeline({ paused: true });
    const wordsIn = (sel, at) => tl.fromTo(sel + " .w", { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, at);
    const titleOut = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, at);
    const swapOut = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, at);
    const swapIn = (sel, at) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, at);
    const click = at => {
      tl.to("#ca-cursor", { scale: .88, duration: 0.05 }, at);
      tl.to("#ca-cursor", { scale: 1, duration: 0.08 }, at + 0.05);
    };

    // a. POS: tap Капучино, then Оплатить; the receipt prints.
    tl.fromTo("#ca-pos", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.1);
    wordsIn("#ca-ta", 0.4);
    tl.fromTo("#ca-cursor", { x: 1960, y: 1100 }, { x: 838, y: 330, duration: 0.55, ease: "power3.out" }, 0.55);
    click(1.1);
    tl.fromTo("#ca-t1", { backgroundColor: "#14161D" }, { backgroundColor: "#0B3A8C", duration: 0.1 }, 1.1);
    tl.to("#ca-t1", { backgroundColor: "#14161D", duration: 0.4 }, 1.35);
    tl.fromTo(["#ca-line", "#ca-total"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, stagger: 0.06, ease: "expo.out" }, 1.15);
    tl.to("#ca-cursor", { x: 1600, y: 822, duration: 0.45, ease: "power2.inOut" }, 1.3);
    click(1.8);
    tl.to("#ca-pay", { backgroundColor: "#3FA9F5", color: "#FFFFFF", duration: 0.08 }, 1.8);
    tl.fromTo("#ca-receipt", { opacity: 0, y: 160, scale: .6 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" }, 1.9);
    tl.to("#ca-cursor", { x: 1960, y: 1100, duration: 0.3, ease: "power3.in" }, 2.2);
    titleOut("#ca-ta", 2.75);

    // b. Money: the receipt flies into the day's revenue, which ticks up.
    swapOut("#ca-pos", 2.85);
    swapIn("#ca-money", 3.0);
    tl.to("#ca-receipt", { x: -560, y: -150, scale: .25, opacity: 0, duration: 0.45, ease: "power3.in" }, 2.95);
    const rev = { v: 3372000 };
    tl.fromTo(rev, { v: 3372000 }, { v: 3400000, duration: 0.6, ease: "power2.out",
      onUpdate: () => { document.querySelector("#ca-rev").textContent = Math.round(rev.v).toLocaleString("ru-RU"); } }, 3.4);
    tl.fromTo("#ca-rev-up", { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 3.45);
    const line = document.querySelector("#ca-line-path"), ll = line.getTotalLength();
    tl.fromTo(line, { strokeDasharray: ll, strokeDashoffset: ll }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 3.2);
    tl.fromTo("#ca-area-path", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 3.6);
    wordsIn("#ca-tb", 3.1);
    titleOut("#ca-tb", 5.65);

    // c. Raw stock: beans run low, the order to the supplier is created by itself.
    swapOut("#ca-money", 5.8);
    swapIn("#ca-stock", 5.95);
    wordsIn("#ca-tc", 6.05);
    const kg = { v: 12 };
    tl.fromTo(kg, { v: 12 }, { v: 2, duration: 1.0, ease: "power2.inOut",
      onUpdate: () => { document.querySelector("#ca-kg").textContent = Math.round(kg.v) + " кг"; } }, 6.4);
    tl.fromTo("#ca-bar i", { scaleX: 1, backgroundColor: "#4ADE80" }, { scaleX: 2 / 12, backgroundColor: "#F0A03C", duration: 1.0, ease: "power2.inOut" }, 6.4);
    tl.to("#ca-status-ok", { opacity: 0, duration: 0.1 }, 7.2);
    tl.fromTo("#ca-status-low", { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 7.2);
    tl.fromTo("#ca-po", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 7.35);
    titleOut("#ca-tc", 9.0);

    // d. Supplier card on top of the order.
    swapOut("#ca-stock", 9.15);
    tl.fromTo("#ca-sup", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 9.2);
    wordsIn("#ca-td", 9.3);
    tl.fromTo(".ca-sup-row", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.08, ease: "expo.out" }, 9.45);
    titleOut("#ca-td", 10.45);
    // The pack moves on to the supermarket.
    tl.fromTo("#ca-bag", { x: -260 }, { x: 2100, duration: 0.6, ease: "power2.in" }, 10.4);
    window.__timelines["cafe"] = tl;
  </script>
